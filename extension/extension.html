<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Grabber</title>
    <!-- Baloo 2 (headings) + Quicksand (body/UI) — matches Orbit's own fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- page header -->
        <div class="header">
            <!-- Orbit's mark: a ring around a dot, matching favicon.svg -->
            <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <rect x="0" y="0" width="100" height="100" rx="22" fill="var(--color-bg)" />
                <circle cx="50" cy="50" r="30" fill="none" stroke="var(--color-ink)" stroke-opacity="0.35" stroke-width="7" />
                <circle cx="50" cy="50" r="14" fill="var(--color-ink)" />
            </svg>
            <span class="header-title">Orbit</span>
            <span class="header-subtitle">Grabber</span>
        </div>

        <!-- steps -->
        <div class="steps-card">
            <div class="step">
                <span class="step-number">1</span>
                <p>Open the article you'd like to speed read.</p>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <p>Hit <span class="fw-semibold">Grab</span> to send it straight to Orbit.</p>
            </div>
        </div>

        <!-- button -->
        <button id="grabButton" class="btn-primary" type="button">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"/>
            </svg>
            <span class="btn-spinner hidden" aria-hidden="true"></span>
            <span class="btn-label">Grab Article</span>
        </button>

        <!-- footer -->
        <p class="footer">Orbit &copy; 2026</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
