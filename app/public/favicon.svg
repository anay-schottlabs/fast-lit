<?xml version="1.0" encoding="UTF-8"?>
<!-- Orbit's mark: a light-gray ring around a dark-gray core, exactly
     matching the mascot on the home page (HomePage.vue's ring-around-a-dot
     motif: border-ink/35 ring, solid bg-ink core). Cream rounded-square
     background so it reads as a proper app icon and stands out clearly
     against any browser tab bar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#F2EFE9" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2B2926" stroke-opacity="0.35" stroke-width="7" />
  <circle cx="50" cy="50" r="14" fill="#2B2926" />
</svg>
